[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utility-safety-ai"
version = "1.0.0"
description = "Auditable computer-vision safety monitoring for utility and construction worksites."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Utility Site Safety AI Contributors"},
]
keywords = ["computer-vision", "safety", "ppe", "yolo", "utility", "construction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ultralytics>=8.3.0,<9.0",
    "lap>=0.5.12,<0.6",
    "opencv-python>=4.8.0,<5.0",
    "numpy>=1.26.0,<2.0.0",
    "Pillow>=10.0.0,<13.0",
    "streamlit>=1.38.0,<2.0",
    "pyyaml>=6.0.1,<7.0",
    "click>=8.1.0,<9.0",
    "pandas>=2.0.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0,<2.0",
    "mypy>=1.11.0,<2.0",
    "pytest>=8.0.0,<10.0",
    "pytest-cov>=5.0.0,<8.0",
    "ruff>=0.6.0,<1.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
utility-safety-ai = "utility_safety_ai.cli:main"

[project.urls]
Homepage = "https://github.com/MengyangGao/utility-site-safety-ai-system"
Repository = "https://github.com/MengyangGao/utility-site-safety-ai-system"
Issues = "https://github.com/MengyangGao/utility-site-safety-ai-system/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["utility_safety_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
