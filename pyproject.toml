[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utility-safety-ai"
version = "2.2.0"
description = "Computer-vision PPE and restricted-zone monitoring for utility and construction worksites."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "docs/legal/sample-photos.md"]
authors = [
    {name = "Utility Site Safety AI Contributors"},
]
keywords = ["computer-vision", "safety", "ppe", "yolo", "utility", "construction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "ultralytics>=8.4.147,<9.0",
    "lap>=0.5.12,<0.6",
    "opencv-python>=4.8.0,<5.0",
    "numpy>=1.26.0,<2.0.0",
    "Pillow>=10.0.0,<13.0",
    "streamlit>=1.38.0,<2.0",
    "pyyaml>=6.0.1,<7.0",
    "click>=8.1.0,<9.0",
    "pandas>=2.0.0,<4.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
mqtt = ["paho-mqtt>=2.1,<3"]
dev = [
    "build>=1.2.0,<2.0",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "paho-mqtt>=2.1,<3",
    "mypy>=1.11.0,<2.0",
    "pytest>=8.0.0,<10.0",
    "pytest-cov>=5.0.0,<8.0",
    "pytest-github-actions-annotate-failures>=0.4.2,<0.5",
    "ruff>=0.6.0,<1.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
utility-safety-ai = "utility_safety_ai.cli:main"

[project.urls]
Homepage = "https://github.com/MengyangGao/utility-site-safety-ai-system"
Repository = "https://github.com/MengyangGao/utility-site-safety-ai-system"
Issues = "https://github.com/MengyangGao/utility-site-safety-ai-system/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["utility_safety_ai*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["utility_safety_ai"]
omit = ["src/utility_safety_ai/tools/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.setuptools.data-files]
"share/utility-safety-ai/models" = ["models/ppe_yolo11n.pt", "models/yolo11n.pt", "models/registry.json"]
"share/utility-safety-ai/examples/sample_images" = ["examples/sample_images/*.jpg"]
"share/utility-safety-ai/examples/sample_videos" = ["examples/sample_videos/*.mp4"]
"share/utility-safety-ai/examples" = ["examples/*.yaml"]

# CPU reference wheels keep Linux/Windows demo and CI installs free of CUDA runtimes.
# macOS uses the normal PyPI wheel, including its MPS backend.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[dependency-groups]
browser = [
    "playwright>=1.55,<2",
]
