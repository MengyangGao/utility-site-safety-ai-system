name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify dependency graph
        run: pip check

      - name: Run tests with coverage
        run: pytest -q --cov=utility_safety_ai --cov-report=term-missing --cov-fail-under=70

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check package
        run: mypy src/utility_safety_ai

      - name: Verify web app imports
        run: python -c "import app"

      - name: Build distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m build

      - name: Smoke-test wheel against the validated dependency environment
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          # Dependencies already passed pip check and the full test suite above. Reuse them so the
          # smoke test validates the wheel/entry point without downloading a second CUDA toolchain.
          python -m venv --system-site-packages "$RUNNER_TEMP/utility-safety-wheel-smoke"
          "$RUNNER_TEMP/utility-safety-wheel-smoke/bin/pip" install --no-deps --force-reinstall dist/*.whl
          "$RUNNER_TEMP/utility-safety-wheel-smoke/bin/utility-safety-ai" --help
