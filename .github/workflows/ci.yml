name: CI
on:
  push:
    branches: [main, 'modernization/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv pip check
      - run: uv run --extra dev pytest -q --cov=utility_safety_ai --cov-fail-under=75
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          python-version: '3.11'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra dev --group browser
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run --extra dev mypy src/utility_safety_ai
      - run: uv run utility-safety-ai audit-provenance
      - run: uv build
      - name: Smoke-test installed wheel and bundled PPE weights
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/safety-wheel"
          uv pip install --python "$RUNNER_TEMP/safety-wheel/bin/python" --torch-backend=cpu dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/safety-wheel/bin/python" -c 'from utility_safety_ai.resources import resource_root; from utility_safety_ai.detection.model_loader import resolve_model_path; assert resolve_model_path(None).is_file(); assert (resource_root() / "examples/sample_images/construction_site_ppe_01.jpg").is_file()'
          "$RUNNER_TEMP/safety-wheel/bin/utility-safety-ai" doctor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/

      - run: uv run --extra dev --group browser playwright install --with-deps chromium
      - run: uv run --extra dev --group browser python tools/smoke_web.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dashboard-smoke
          path: outputs/browser-smoke/
          if-no-files-found: warn
